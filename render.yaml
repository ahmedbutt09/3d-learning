# Render Blueprint: one web service (API + built React app) and a Postgres database.
services:
  - type: web
    name: 3d-learning
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 3d-learning-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "false"
      # Add your Vercel domain here if the React app is also deployed on Vercel
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: 3d-learning-db
    plan: free
